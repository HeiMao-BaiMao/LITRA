<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LITRA responsive UI preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #dce3e2; font: 13px/1.4 system-ui; color: #163e36; }
    nav { min-height: 56px; padding: 10px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 1; background: #fff; border-bottom: 1px solid #bccbc7; }
    button, select { padding: 7px 10px; border: 1px solid #b4c5bf; border-radius: 5px; background: #fff; color: inherit; }
    button[aria-pressed=true] { background: #185f50; color: #fff; }
    #stage { padding: 24px; width: max-content; min-width: 100%; }
    iframe { display: block; background: #fff; border: 0; box-shadow: 0 8px 28px #26383133; }
  </style>
</head>
<body>
  <nav aria-label="Preview viewport controls">
    <strong>Fictional WASM preview</strong>
    <label>Version <select id="version"><option>current</option><option>baseline</option></select></label>
    <label>Page <select id="page"><option value="">Main</option><option value="settings-window.html">Characters / world</option><option value="chat-window.html">Chat</option><option value="summary-window.html">Summary</option><option value="memo-window.html">Episode memo</option><option value="project-memo-window.html">Project memos</option><option value="genre-library.html">Genre library</option></select></label>
    <label>Data <select id="fixture"><option>populated</option><option>empty</option><option>error</option><option>loading</option></select></label>
    <button type="button" data-width="1440" aria-pressed="true">1440px</button>
    <button type="button" data-width="1024" aria-pressed="false">1024px</button>
    <button type="button" data-width="768" aria-pressed="false">768px</button>
    <button type="button" data-width="390" aria-pressed="false">390px</button>
    <button type="button" id="reload">Reload</button>
    <output id="dimensions">1440 × 900</output>
  </nav>
  <div id="stage"><iframe title="Actual LITRA Rust/WASM application" id="app-frame" width="1440" height="900" src="/current/"></iframe></div>
  <script>
    const frame = document.getElementById('app-frame');
    const version = document.getElementById('version');
    const page = document.getElementById('page');
    const fixture = document.getElementById('fixture');
    function navigate() { frame.src = `/${version.value}/${page.value}?fixture=${fixture.value}`; }
    for (const select of [version, page, fixture]) select.addEventListener('change', navigate);
    document.getElementById('reload').addEventListener('click', navigate);
    for (const button of document.querySelectorAll('[data-width]')) button.addEventListener('click', () => {
      frame.width = button.dataset.width;
      document.getElementById('dimensions').textContent = `${frame.width} × 900`;
      for (const other of document.querySelectorAll('[data-width]')) other.setAttribute('aria-pressed', String(other === button));
    });
  </script>
</body>
</html>
