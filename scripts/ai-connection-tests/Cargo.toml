[package]
name = "litra-ai-connection-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }
tokio-util = "0"
uuid = { version = "1", features = ["v4"] }
base64 = "0"
rand = { version = "0.10", features = ["thread_rng"] }
sha2 = "0"
tauri-command = { path = "tauri-command" }
