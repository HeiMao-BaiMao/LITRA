<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/LITRA.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>リトラチャット - LITRA</title>
  <script type="module">
    import init, * as bindings from '/litra-frontend.js';
    const wasm = await init({ module_or_path: '/litra-frontend_bg.wasm' });
    window.wasmBindings = bindings;
    dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
  </script>
</head>

<body class="detachable-window" data-rust-window="chat">
  <aside class="chat-panel detached">
    <div class="chat-panel-header">
      <div class="chat-heading"><span class="chat-heading-mark" aria-hidden="true">L</span><div><h3>リトラ</h3><p>物語をいっしょに考える</p></div></div>
    </div>
    <div class="chat-settings-row">
      <label for="chat-provider"><span>プロバイダー</span><select id="chat-provider" title="プロバイダー"></select></label>
      <label for="chat-model"><span>モデル</span><select id="chat-model" title="モデル"></select></label>
    </div>
    <div id="chat-messages" class="chat-messages" role="log" aria-label="リトラとの会話"></div>
    <form id="chat-form" class="chat-form">
      <textarea id="chat-input" class="chat-input" aria-label="リトラへのメッセージ" placeholder="リトラと自由に話す..." rows="2"></textarea>
      <div class="chat-controls">
        <button id="btn-direct-writing" type="button" class="direct-writing-toggle" aria-pressed="false" title="多段生成を省略し、チャットモデルから本文へ直接書き込みます">⚡ 直接執筆 OFF</button>
        <button id="btn-send" type="submit">送信</button>
        <button id="btn-cancel" type="button" class="hidden" disabled>
          停止
        </button>
      </div>
    </form>
  </aside>
</body>

</html>
