name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches tauri.conf.json version
        id: version
        shell: pwsh
        run: |
          $tauriConf = Get-Content src-tauri/tauri.conf.json -Raw
          if ($tauriConf -notmatch '"version"\s*:\s*"([^"]+)"') {
            throw "Could not find version in src-tauri/tauri.conf.json."
          }

          $version = $Matches[1]
          $tag = "${{ github.ref_name }}"
          $escapedVersion = [regex]::Escape($version)
          if ($tag -notmatch "^(?:v)?$escapedVersion(?:[-+][0-9A-Za-z.-]+)?$") {
            throw "Tag '$tag' does not match tauri.conf.json version '$version' or an allowed prerelease/build variant of it."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $isPrerelease = $tag -match "^[^+]*-"
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  build:
    name: Build Windows release
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-msvc wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install tauri-cli
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Resolve wasm-bindgen version from frontend lockfile
        id: bindgen
        shell: pwsh
        run: |
          cargo metadata --format-version 1 --manifest-path frontend-rs/Cargo.toml *> $null
          $version = Select-String -Path frontend-rs/Cargo.lock -Pattern 'name = "wasm-bindgen"' -Context 0,1 |
            Select-Object -First 1 |
            ForEach-Object { $_.Context.PostContext[0] -replace '^version = "([^"]+)"', '$1' }
          if (-not $version) {
            throw "wasm-bindgen version not found in frontend-rs/Cargo.lock"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install matching wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}

      - name: Build Tauri app
        shell: pwsh
        run: cargo tauri build

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          $releaseArgs = @("--title", $env:TAG_NAME, "--verify-tag", "--generate-notes")
          if ($env:IS_PRERELEASE -eq "true") {
            $releaseArgs += "--prerelease"
          }

          gh release view $env:TAG_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG_NAME @releaseArgs
          } elseif ($env:IS_PRERELEASE -eq "true") {
            gh release edit $env:TAG_NAME --prerelease
          }

      - name: Upload Windows bundles
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $bundleRoot = Join-Path $PWD "src-tauri\target\release\bundle"
          $artifacts = Get-ChildItem -Path $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi", ".msix", ".appx", ".appxbundle", ".zip", ".sig" }

          if (-not $artifacts) {
            Write-Error "No release artifacts found under $bundleRoot"
            exit 1
          }

          foreach ($artifact in $artifacts) {
            gh release upload $env:TAG_NAME $artifact.FullName --clobber
          }
